name: build-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck and build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The hosted image ships the Android SDK. Configuring it directly avoids
      # android-actions/setup-android, which breaks when the image's preinstalled
      # cmdline-tools are newer than the version the action expects.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            echo "sdkmanager: $SM"
          else
            echo "::warning::sdkmanager not found; relying on pre-accepted licences"
          fi
          echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report size
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          {
            echo "### Debug APK"
            echo ""
            echo "- size: $(du -h "$APK" | cut -f1) ($(stat -c%s "$APK") bytes)"
            echo "- sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stitchlab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
